<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPN Drawer</title>
  <meta name="CPN Drawer" content="Create colored Petri nets with database and SQL Queries/Actions integration." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="./app.css">
</head>

<body>
  <div id="container"></div>

  <div id="place-legend" class="place-legend"></div>
  <div id="sql-dialog" class="sql-dialog"></div>

  <div class="top-buttons pnjs-buttons">
    <div>
      <div><button id="rules">Rules</button></div>
    </div>

  </div>

  <div class="bottom-buttons pnjs-buttons">
    <div>
      <div><button id="js-docs">Documentation</button></div>
      <div><button id="js-report-bug">Report a bug</button></div>
      <div><button id="js-demo-nets">Demo graphs</button>
      </div>
    </div>

    <div>
      <div>open</div>
      <div><button id="js-open-pnml" class="pnjs-buttons-active" title="open plain PNML file">PNML file</button></div>
      <div><button id="js-open-dbpnml" class="pnjs-buttons-active" title="open PNML with database">PNML + DB</button>
      </div>
    </div>

    <div>
      <div>download</div>
      <div><button id="js-download-pnml" class="pnjs-buttons-active" title="download plain PNML file">PNML file</button>
      </div>
      <div><button id="js-download-dbpnml" class="pnjs-buttons-active" title="download PNML with database">PNML +
          DB</button></div>
      <div><button id="js-download-tpn" class="pnjs-buttons-active" title="download as TPN file">TPN file</button></div>
      <div><button id="js-download-svg" class="pnjs-buttons-active" title="download as SVG image">SVG image</button>
      </div>
      <div><button id="js-download-pdf" class="pnjs-buttons-active" title="download as PDF file">PDF file</button></div>
    </div>
  </div>

  <script data-goatcounter="https://processintelligence.goatcounter.com/count" async
    src="//gc.zgo.at/count.js"></script>
</body>

</html>
